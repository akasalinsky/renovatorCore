# Main Menu
start.welcome = Welcome! 🛠 I am the Room Planner Bot.\n\
\n\
I can help you accurately calculate the floor area, wall surface, and the amount of materials needed for your renovation.\n\
\n\
Available commands:\n\
• create <name> <length> <width> <height> — add a new room\n\
• describe — view room characteristics\n\
• plan [scale] — draw a room plan\n\
• area — get the net floor area\n\
• wallpaper <width> <length> — calculate wallpaper rolls\n\
• opening <wallNumber> door/window <width> <height> <distanceFromLeft> — add a door or window\n\
• lang en|ru — switch language\n\
• budget [linoleum|laminate] [total] — estimate (default linoleum)\n\
• help — show this instruction\n\
• exit — reset current data and exit\n\
\n\
💡 Important: please enter all dimensions in millimeters (mm) for construction accuracy!

choose.language = Please choose your language / Пожалуйста, выберите язык EN/RU
goodbye = Goodbye! 👋
unknown.command = It seems I don't know the command "{0}" 🤔. Send the word "help" to see the list of available actions.
empty.message = Empty message

# Command create
create.usage = To create a room, type the word "create", followed by the name and three dimensions in millimeters (Length Width Height).\n\
💡 Example: create Bedroom 5000 4000 2700\n\
(This means: a 5x4 meter room with a ceiling height of 2.7 m)
create.success = Excellent! The room "{0}" has been successfully created.\n\
Now you can check its "describe" or add openings (doors/windows) to subtract them from the wall area.

# Command describe
room.not.created = You need to create a room first 🏗. Send the command: create <name> <length> <width> <height>
room.description = 📋 Characteristics of the room "{0}":\n\
• Ceiling height: {2} mm\n\
• Number of walls: {1}\n\
• Deductions for windows and doors: {3} m²

# Command plan
plan.usage = Usage: plan [scale]

# Command area
floor.area = Floor area: {0} m²

# Command wallpaper
wallpaper.usage = To calculate wallpaper, type the command "wallpaper", followed by the roll width and length in millimeters.\n\
💡 Hint: Standard rolls are usually 530 mm ("narrow") or 1060 mm ("wide") in width. Standard length is usually 10050 mm (10 meters).\n\
Example: wallpaper 1060 10050
wallpaper.rolls = 🧻 To wallpaper this room, you will need exactly {0} rolls.\n\
💡 Tip: It is highly recommended to buy +1 spare roll in case of defects or complex pattern matching.

# Command lang
lang.unsupported = Unsupported language: {0}
lang.set = Language is set to {0}

# Command opening
opening.usage = Let's add an opening (door or window).\n\
💡 Example for a door: opening 1 door 800 2000 500\n\
(Where: 1 - wall number, 800 - width, 2000 - height, 500 - distance from the left corner. All in mm!)
opening.success = Great, the opening has been successfully added!
opening.incorrectWallNumber = Please insert correct wall number

