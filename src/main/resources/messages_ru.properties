start.welcome = Добро пожаловать! Я Бот-планировщик комнат.\n\
\n\
Я могу помочь вам рассчитать площадь пола, поверхность стен и количество рулонов обоев для вашей комнаты.\n\
\n\
Доступные команды:\n\
\u2022 создать <имя> <длина> <ширина> <высота> — создать новую комнату (размеры в мм)\n\
\u2022 описание — показать описание комнаты и площади\n\
\u2022 план [масштаб] — нарисовать план в ASCII (масштаб по умолчанию 500 мм/символ)\n\
\u2022 площадь — показать площадь пола\n\
\u2022 обои <ширина рулона мм> <длина рулона мм> — рассчитать количество рулонов обоев\n\
\u2022 проем <номерСтены> width <ширина> height <высота> distanceFromLeft <расстояние> [distanceFromFloor <расстояние>] — добавить дверь (6 аргументов) или окно (7 аргументов), размеры в мм\n\
\u2022 язык en|ru — переключить язык\n\
\u2022 помощь — показать эту инструкцию снова\n\
\u2022 выход — выход (в боте сбрасывается сессия; в CLI программа завершается)\n\
\n\
Вы можете переключить язык в любой момент, введя /lang ru или /lang en.

