# Главное меню
start.welcome = Добро пожаловать! 🛠 Я — Бот-планировщик комнат.\n\
\n\
Я помогу вам точно рассчитать площадь пола, стен и количество материалов для ремонта.\n\
\n\
Доступные команды:\n\
• создать <имя> <длина> <ширина> <высота> — добавить новую комнату\n\
• описание — посмотреть характеристики комнаты\n\
• план [масштаб] — нарисовать схему комнаты\n\
• площадь — узнать чистую площадь\n\
• обои <ширина> <длина> — рассчитать количество рулонов\n\
• проем <номерСтены> дверь/окно <ширина> <высота> <отступСлева> — добавить дверь или окно\n\
• язык en|ru — переключить язык\n\
• смета [linoleum|laminate] [total] — смета (по умолчанию линолеум)\n\
• помощь — показать эту инструкцию\n\
• выход — сбросить текущие данные\n\
\n\
💡 Важно: все размеры мы вводим в миллиметрах (мм) для строительной точности.

choose.language = Пожалуйста, выберите язык / Please choose your language EN/RU
goodbye = До свидания! 👋
unknown.command = Кажется, я не знаю команду «{0}» 🤔. Отправьте слово «помощь», чтобы посмотреть список доступных действий.
empty.message = Пустое сообщение

# Команда create
create.usage = Чтобы создать комнату, напишите слово «создать», затем название и три размера в миллиметрах (Длина Ширина Высота).\n\
💡 Пример: создать Спальня 5000 4000 2700\n\
(Это означает: комната 5х4 метра с высотой потолков 2.7 м)
create.success = Отлично! Комната «{0}» успешно создана.\n\
Теперь вы можете посмотреть ее «описание» или добавить проемы (двери/окна), чтобы вычесть их из площади.

# Команда describe
room.not.created = Сначала нужно создать комнату 🏗. Отправьте команду: создать <имя> <длина> <ширина> <высота>
room.description = 📋 Характеристики комнаты «{0}»:\n\
• Высота потолков: {2} мм\n\
• Количество стен: {1}\n\
• Вычет на окна и двери: {3} м²

# Команда plan
plan.usage = Использование: план [масштаб]

# Команда area
floor.area = Площадь пола: {0} м²

# Команда wallpaper
wallpaper.usage = Для расчета обоев напишите команду «обои», ширину и длину рулона в миллиметрах.\n\
💡 Подсказка: Стандартные рулоны бывают шириной 530 мм («узкие») или 1060 мм («широкие»). Длина обычно 10050 мм (10 метров).\n\
Пример: обои 1060 10050
wallpaper.rolls = 🧻 Для оклейки этой комнаты вам потребуется ровно {0} рулонов.\n\
💡 Совет: Рекомендуется взять +1 рулон про запас на случай брака или сложного рисунка.

# Команда lang (смена языка)
lang.unsupported = Неподдерживаемый язык: {0}
lang.set = Язык установлен на {0}

# Команда opening
opening.usage = Давайте добавим проем (дверь или окно).\n\
💡 Пример для двери: проем 1 дверь 800 2000 500\n\
(Где: 1 - номер стены, 800 - ширина, 2000 - высота, 500 - отступ слева. Все в мм!)
opening.success = Отлично, проем успешно добавлен!
opening.incorrectWallNumber = Пожалуйста, введите корректный номер стены

